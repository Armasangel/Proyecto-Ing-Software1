name: Validar PR Template
on:
  pull_request:
    branches:
      - develop
    types: [opened, edited, synchronize, reopened]
jobs:
  validar-template:
    name: Sugerencias sobre el PR
    runs-on: ubuntu-latest
    steps:
      - name: Revisar cuerpo del PR
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const errores = [];
            if (!body.includes('## 📋 Descripción del cambio')) {
              errores.push('Falta la sección "Descripción del cambio".');
            } else {
              const desc = body.split('## 🔧')[0]
                               .replace('## 📋 Descripción del cambio', '')
                               .replace(/<!--.*?-->/gs, '')
                               .trim();
              if (desc.length < 20) {
                errores.push('La descripción es muy corta (mínimo 20 caracteres).');
              }
            }
            const tiposMarcados = (body.match(/- \[x\]/gi) || []).length;
            if (tiposMarcados === 0) {
              errores.push('Marca al menos un tipo de cambio.');
            }
            if (!body.includes('## 🧪 ¿Cómo probaste los cambios?')) {
              errores.push('Falta la sección de pruebas.');
            }
            const checklistSection = body.split('## ✅ Checklist')[1] || '';
            const checksDone = (checklistSection.match(/- \[x\]/gi) || []).length;
            if (checksDone < 1) {
              errores.push('Marca al menos 1 item del checklist.');
            }
            if (errores.length > 0) {
              const mensaje = [
                '## ⚠️ Sugerencias para mejorar el PR\n',
                'Considera lo siguiente:\n',
                ...errores.map(e => `- ${e}`),
                '\n---',
                '_Esto no bloquea el PR, pero ayuda a mantener calidad._'
              ].join('\n');
              console.log(mensaje);
            } else {
              console.log('✅ PR bien estructurado.');
            }
  lint-and-test:
    name: Lint y pruebas automatizadas
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: dsm_user
          POSTGRES_PASSWORD: dsm_password
          POSTGRES_DB: deposito_san_miguel
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Instalar dependencias
        run: npm ci
      - name: Correr lint
        run: npm run lint
      - name: Crear schema en la base de datos
        run: psql "$DATABASE_URL" -f ./init/01_schema.sql
        env:
          DATABASE_URL: postgresql://dsm_user:dsm_password@localhost:5432/deposito_san_miguel
      - name: Correr pruebas automatizadas
        run: npm test
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DATABASE_URL: postgresql://dsm_user:dsm_password@localhost:5432/deposito_san_miguel