# docker-compose.prod.yml — override de producción.
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Cambia el servicio `app` para que use la imagen compilada (target
# `production` del Dockerfile) y sirva con `next start`, sin montar el
# source como volumen ni ejecutar `next dev`. La base de datos, pgadmin y el
# respaldo siguen idénticos al compose base.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    environment:
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET no está definido — copia .env.example a .env}
      - DATABASE_URL=postgresql://dsm_user:dsm_password@db:5432/deposito_san_miguel
      - GMAIL_USER=${GMAIL_USER}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FILE_DIR=/app/logs
      - LOG_FILE_MAX_SIZE=${LOG_FILE_MAX_SIZE:-50M}
      - LOG_FILE_KEEP=${LOG_FILE_KEEP:-5}
    # `!override` reemplaza los volúmenes del compose base: sin bind-mount del
    # source ni de node_modules/.next — el código y el bundle ya vienen
    # dentro de la imagen compilada (target `production`). Se conserva
    # `logs_data` para la persistencia de logs.
    volumes: !override
      - logs_data:/app/logs
    restart: unless-stopped
    # `!override` reemplaza el `command: npm run dev` del compose base: en
    # producción se sirve el bundle compilado con next start.
    command: !override ["npm", "start"]

volumes:
  logs_data: