services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # Sin `target`, Docker construye el ÚLTIMO stage del Dockerfile
      # (production), que trae `npm ci --omit=dev`: sin typescript, tailwind,
      # jest ni nada de devDependencies, así que `next dev` no compilaba.
      target: dev
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=development
      - JWT_SECRET=deposito_san_miguel_dev_secret_cambia_en_produccion
      - DATABASE_URL=postgresql://${POSTGRES_USER:-dsm_user}:${POSTGRES_PASSWORD:-dsm_password}@db:5432/${POSTGRES_DB:-deposito_san_miguel}
      - GMAIL_USER=${GMAIL_USER}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD}
      - LOG_LEVEL=${LOG_LEVEL:-debug}
      - LOG_FILE_DIR=/app/logs
      - LOG_FILE_MAX_SIZE=${LOG_FILE_MAX_SIZE:-50M}
      - LOG_FILE_KEEP=${LOG_FILE_KEEP:-5}
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
      - logs_data:/app/logs
    depends_on:
      db:
        condition: service_healthy
    command: npm run dev

  test:
    build:
      context: .
      dockerfile: Dockerfile
      # stage dev: hace falta jest/typescript/MSW (ver servicio `app`).
      target: dev
    environment:
      - NODE_ENV=test
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET no está definido — copia .env.example a .env}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-dsm_user}:${POSTGRES_PASSWORD:-dsm_password}@db:5432/${POSTGRES_DB:-deposito_san_miguel}
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
    command: npm test -- --ci
    profiles: ["test"]

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dsm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dsm_password}
      POSTGRES_DB: ${POSTGRES_DB:-deposito_san_miguel}
    ports:
      - "5433:5432"
    volumes:
      - ./init:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dsm_user} -d ${POSTGRES_DB:-deposito_san_miguel}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    # Perfil "tools": no arranca con `docker compose up`. Debe pedirse
    # explícitamente con `docker compose --profile tools up -d pgadmin`.
    # Así la UI de administración de la base no queda expuesta por defecto,
    # y en particular nunca en producción (docker-compose.prod.yml lo hereda
    # pero sin el perfil activo no se levanta).
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@dsm.com}
      # Sin default a propósito: la UI de pgAdmin queda expuesta en el puerto
      # 5050, así que la contraseña debe venir del entorno.
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?define PGADMIN_DEFAULT_PASSWORD en tu .env}
    ports:
      - "5050:80"
    depends_on:
      - db
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  # Respaldo automático de PostgreSQL: dumps periódicos con rotación (diaria/
  # semanal/mensual). Guarda todo en ./backups (fuera de los volúmenes de
  # Docker) para que sobreviva a un `docker compose down -v`.
  #
  db_backup:
    image: prodrigestivill/postgres-backup-local:16
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=deposito_san_miguel
      - POSTGRES_USER=dsm_user
      - POSTGRES_PASSWORD=dsm_password
      - POSTGRES_EXTRA_OPTS=-Z6 --schema=public --blobs
      - SCHEDULE=@daily
      - BACKUP_ON_START=TRUE
      - BACKUP_KEEP_DAYS=7
      - BACKUP_KEEP_WEEKS=4
      - BACKUP_KEEP_MONTHS=6
      - HEALTHCHECK_PORT=8080
    volumes:
      - ./backups:/backups

volumes:
  postgres_data:
  pgadmin_data:
  logs_data:
